<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>இலத்திரனியல் நிகழ்த்துகை</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1020;font-family:'Noto Sans Tamil',sans-serif;color:#f4f1ea}
#st{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:linear-gradient(-45deg,#14213d,#3a2a5c,#0f4c5c,#5c2a4d);background-size:400% 400%;animation:bg 14s ease infinite}
@keyframes bg{50%{background-position:100% 50%}}
.bub{position:absolute;bottom:-120px;border-radius:50%;background:rgba(255,255,255,.12);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-900px) scale(1.4);opacity:0}}
.sl{position:absolute;inset:0;padding:48px 70px;display:none;flex-direction:column;gap:22px}
.sl.on{display:flex;animation:var(--tin,tA) .9s both}.sl.out{display:flex;animation:tO .7s both;pointer-events:none}
h2{font-size:50px;color:#f4a261;line-height:1.3;animation:drop .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-120px);opacity:0}}
.ic{display:inline-block;animation:fl 2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(10deg)}}
.sub{font-size:26px;line-height:1.6;animation:up .8s .3s both,wipe 1.4s .3s both}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.row{display:flex;gap:30px}
.card{position:relative;overflow:hidden;flex:1;padding:28px 32px;border-radius:24px;box-shadow:0 10px 30px #0006}
.ms{background:#264a7acc;animation:inL .8s .4s both,flt 4s 1.4s ease-in-out infinite,glw 3s 1.4s ease-in-out infinite}.lo{background:#1f5f4acc;animation:inR .8s .4s both,flt 4s 2s ease-in-out infinite,glw 3s 2s ease-in-out infinite}
@keyframes inL{from{transform:translateX(-300px) rotate(-8deg);opacity:0}}
@keyframes inR{from{transform:translateX(300px) rotate(8deg);opacity:0}}
h3{font-size:26px;color:#f4a261;margin-bottom:12px}
li{font-size:24px;line-height:1.6;margin-left:22px;animation:up .6s both;animation-delay:calc(.9s + var(--d)*.3s)}
li:nth-child(odd){animation-name:flipIn;transform-origin:top center}
.rt{display:flex;gap:40px;align-items:flex-end;margin-top:6px}
.rt div{border:5px solid #f4a261;border-radius:10px;display:grid;place-items:center;font-size:36px;font-weight:700;animation:pul 2s ease-in-out infinite,pop .8s 1.4s both}
@keyframes pul{50%{transform:scale(1.12);border-color:#2a9d8f}}
@keyframes pop{from{transform:scale(0)}}
.chips{display:flex;gap:16px;margin-top:10px}
.chips div{flex:1;background:#e76f51;border-radius:18px;padding:22px 8px;text-align:center;font-size:22px;font-weight:700;animation:bn 1.6s ease-in-out infinite,pop .7s both;animation-delay:calc(var(--d)*.2s),calc(.8s + var(--d)*.2s)}
.chips span{display:block;font-size:44px}
@keyframes bn{50%{transform:translateY(-18px)}}
.o{position:relative;width:340px;height:340px;border:3px dashed #ffffff55;border-radius:50%;animation:sp 14s linear infinite;flex:none}
.o i{position:absolute;inset:0;transform:rotate(var(--a))}
.o b{position:absolute;left:50%;top:-30px;margin-left:-30px;font-size:60px;font-weight:400;animation:ccw 14s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes ccw{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(calc(var(--a)*-1 - 360deg))}}
.mid{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 30px}
h1{font-size:76px;line-height:1.3;animation:drop 1s both}
.cv h1{animation:drop 1s both,neon 2.5s 1s ease-in-out infinite}
.cv p{font-size:30px;color:#f4a261;margin-top:14px;animation:up 1s .5s both,wipe 1.6s .5s both}
.th h1{font-size:150px;animation:zm 2s ease-in-out infinite,neon 2.5s ease-in-out infinite}
.th p{font-size:48px;margin-top:10px;animation:col 5s linear infinite reverse}
@keyframes col{0%{color:#ff595e}17%{color:#ffca3a}34%{color:#8ac926}51%{color:#1982c4}68%{color:#6a4c93}85%{color:#ff7bd5}100%{color:#ff595e}}
@keyframes zm{50%{transform:scale(1.1)}}
.wk{position:absolute;bottom:6px;left:-80px;font-size:50px;animation:wk 18s linear infinite;pointer-events:none}
.wk span{display:inline-block;animation:hop .5s ease-in-out infinite}
@keyframes wk{to{transform:translateX(1440px)}}
@keyframes hop{50%{transform:translateY(-14px)}}
.fy{position:absolute;top:10px;right:-80px;font-size:46px;animation:fy 24s linear infinite;pointer-events:none}
@keyframes fy{to{transform:translateX(-1440px)}}
#nav{position:absolute;bottom:14px;right:20px;display:flex;gap:10px;align-items:center;z-index:5}
#nav button{background:#f4a261;border:0;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;transition:transform .2s}
#nav button:hover{transform:scale(1.2) rotate(8deg)}
#pg{font-size:18px}#fs{background:#2a9d8f!important;margin-left:8px;font-size:22px!important}
#bar{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,#f4a261,#e76f51,#ffca3a,#f4a261);background-size:200% 100%;animation:barmove 2s linear infinite;transition:width .5s}
@keyframes barmove{to{background-position:200% 0}}

@keyframes tA{from{transform:translateX(var(--x,100%));opacity:0}}
@keyframes tB{from{transform:scale(.2) rotate(var(--r,-25deg));opacity:0}}
@keyframes tC{from{transform:perspective(900px) rotateY(var(--r2,90deg));opacity:0}}
@keyframes tD{from{transform:scale(1.6);filter:blur(20px);opacity:0}}
@keyframes tE{from{transform:perspective(900px) rotateX(80deg) translateY(60px);opacity:0}}
@keyframes tF{from{clip-path:circle(0% at 50% 50%);opacity:.3}to{clip-path:circle(100% at 50% 50%)}}
@keyframes tG{from{transform:translateY(100%) skewY(6deg);opacity:0}}
@keyframes tO{to{transform:translateX(calc(var(--x,100%)*-.6)) scale(.8);opacity:0}}
@keyframes flt{50%{transform:translateY(-8px)}}
#st.hue{animation:bg 14s ease infinite,hr 5s linear infinite}@keyframes hr{to{filter:hue-rotate(360deg)}}
.wk2{position:absolute;bottom:60px;right:-80px;font-size:44px;animation:wk2 13s linear infinite;pointer-events:none}.wk2 span{display:inline-block;animation:hop .4s ease-in-out infinite}
@keyframes wk2{to{transform:translateX(-1440px)}}
.bub.e{background:none;animation-name:rise,tw}@keyframes tw{50%{filter:brightness(2)}}
.ag{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ag div{background:#ffffff22;border-radius:16px;padding:14px 20px;font-size:25px;display:flex;gap:14px;align-items:center;animation:inL .7s both;animation-delay:calc(var(--d)*.2s)}
.ag div:nth-child(even){animation-name:inR}
.ag b{width:44px;height:44px;border-radius:50%;background:#f4a261;color:#14213d;display:grid;place-items:center;flex:none;animation:sp 6s linear infinite}
.ag div:nth-child(3n) b{animation:hb 1.2s ease-in-out infinite}
.mock{align-self:center;width:480px;height:180px;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:28px;font-weight:700;text-align:center;padding:16px;box-shadow:0 0 40px #f4a261;animation:mk 3s ease-in-out infinite,pop 1s 1.4s both}
.mock span{animation:col 5s linear infinite}@keyframes mk{50%{transform:scale(1.06) rotate(-2deg)}}
.cf{position:absolute;top:-60px;font-size:34px;animation:fall linear infinite}@keyframes fall{to{transform:translateY(820px) rotate(540deg)}}
.lc{display:inline-block;animation:col 4s linear infinite,bob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.35s),calc(var(--i)*-.12s)}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ===== NEW ANIMATION TYPES ===== */
/* 1. wipe reveal (left to right) */
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
/* 2. 3D flip-in bullets */
@keyframes flipIn{from{transform:perspective(600px) rotateX(-90deg);opacity:0}}
/* 3. neon glow text */
@keyframes neon{50%{text-shadow:0 0 12px #f4a261,0 0 32px #f4a261aa,0 0 60px #e76f5188}}
/* 4. glowing card pulse */
@keyframes glw{50%{box-shadow:0 0 38px #f4a261aa}}
/* 5. light sheen sweeping across cards */
.card::after{content:'';position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-20deg);animation:shine 4.5s 1.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{to{left:140%}}
/* 6. icon variety: flip, heartbeat, swing, tada */
@keyframes spinY{50%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.ic{transform-origin:top center}
@keyframes swing{20%{transform:rotate(18deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(6deg)}80%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@keyframes tada{0%{transform:scale(1)}10%,20%{transform:scale(.9) rotate(-5deg)}30%,50%,70%{transform:scale(1.2) rotate(5deg)}40%,60%{transform:scale(1.2) rotate(-5deg)}80%,100%{transform:scale(1) rotate(0)}}
/* 7. twinkling stars + shooting stars */
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twk 2s ease-in-out infinite}
@keyframes twk{50%{opacity:.1;transform:scale(2.2)}}
.ss{position:absolute;top:60px;left:-200px;width:160px;height:3px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:ss 8s linear infinite;pointer-events:none}
@keyframes ss{0%{transform:translate(0,0) rotate(25deg);opacity:1}14%{transform:translate(1000px,466px) rotate(25deg);opacity:0}100%{transform:translate(1000px,466px) rotate(25deg);opacity:0}}
/* 8. drifting blurred colour blobs */
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(300px,-120px) scale(1.4)}}
/* 9. rocket flying diagonally */
.rk{position:absolute;left:-80px;bottom:-60px;font-size:46px;animation:rk 22s 4s linear infinite;pointer-events:none}
@keyframes rk{to{transform:translate(1440px,-840px)}}
/* 10. light curtain sweeping on every slide change */
#cur{position:absolute;top:0;left:0;width:320px;height:100%;background:linear-gradient(90deg,transparent,#f4a26166,transparent);transform:translateX(-320px);pointer-events:none;z-index:4}
#cur.go{animation:cur .9s ease-in-out}
@keyframes cur{from{transform:translateX(-320px)}to{transform:translateX(1280px)}}
/* 11. click ripple */
.rip{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid #f4a261;border-radius:50%;animation:rp .8s ease-out forwards;pointer-events:none;z-index:6}
@keyframes rp{to{transform:scale(8);opacity:0}}

/* ===== ROUND 2: MORE NEW ANIMATION TYPES ===== */
#bs{position:absolute;inset:-30px;transition:transform .25s ease-out}
/* A. binary-code rain (ICT theme) */
.bin{position:absolute;top:0;font:18px/22px monospace;white-space:pre;color:#2a9d8f;opacity:.25;animation:binf linear infinite}
@keyframes binf{from{transform:translateY(-700px)}to{transform:translateY(760px)}}
/* B. glitch effect on the cover title */
.cv h1{animation:drop 1s both,neon 2.5s 1s ease-in-out infinite,glitch 5s 2.5s infinite}
@keyframes glitch{0%,89%,100%{transform:none;filter:none}
 91%{transform:translate(-5px,2px) skewX(8deg);filter:drop-shadow(5px 0 #ff0055) drop-shadow(-5px 0 #00e5ff)}
 93%{transform:translate(5px,-2px) skewX(-8deg);filter:drop-shadow(-5px 0 #ff0055) drop-shadow(5px 0 #00e5ff)}
 95%{transform:translate(-2px,0) skewX(4deg);filter:drop-shadow(3px 0 #ff0055) drop-shadow(-3px 0 #00e5ff)}
 97%{transform:none;filter:none}}
/* C. heading underline that draws itself */
.sl h2{position:relative}
.sl h2::after{content:'';position:absolute;left:0;bottom:-6px;height:5px;width:0;border-radius:4px;background:linear-gradient(90deg,#f4a261,#e76f51,#ffca3a);animation:ulw 1.1s .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ulw{to{width:55%}}
/* D. stepped typewriter for card headings */
.card h3{animation:wipe 1.2s .6s steps(22) both}
/* E. bullets: coloured markers + slide-and-glow on hover */
li::marker{color:#f4a261}
li{transition:padding-left .3s,color .3s}
li:hover{padding-left:14px;color:#ffca3a}
/* F. radar pulse rings around the orbiting icons */
.o::before,.o::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid #f4a261;opacity:0;animation:radar 3s ease-out infinite}
.o::after{animation-delay:1.5s}
@keyframes radar{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
/* G. rainbow rotating border on the sample slide box */
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes ang{to{--ang:360deg}}
.mock{border:6px solid transparent;background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from var(--ang),#f4a261,#2a9d8f,#e76f51,#ffca3a,#f4a261) border-box;animation:mk 3s ease-in-out infinite,pop 1s 1.4s both,ang 3s linear infinite}
/* H. morphing blobs */
.blob{animation:drift 18s ease-in-out infinite alternate,morph 9s ease-in-out infinite}
@keyframes morph{50%{border-radius:30% 70% 60% 40%/50% 40% 60% 50%}}
/* I. different exit animation for each slide */
.sl.out{animation:var(--tout,tO) .7s both}
@keyframes tOb{to{transform:rotate(25deg) translateY(120%);opacity:0}}
@keyframes tOc{to{transform:scale(1.5);filter:blur(16px);opacity:0}}
@keyframes tOd{to{transform:perspective(900px) rotateY(-90deg);opacity:0}}
@keyframes tOe{to{clip-path:circle(0% at 50% 50%)}}
/* J. spinning gears in the corner */
.gear{position:absolute;bottom:56px;left:16px;font-size:48px;opacity:.35;animation:sp 6s linear infinite;pointer-events:none}
.g2{left:60px;bottom:92px;font-size:36px;animation:spr 4.5s linear infinite}
@keyframes spr{to{transform:rotate(-360deg)}}
/* L. presenter names */
.by{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:660px;animation:up 1s 1.2s both}
.byl{font-size:28px;font-weight:700;color:#ffca3a;margin-right:4px}
.nm{background:#ffffff22;border:2px solid #f4a261;border-radius:30px;padding:6px 18px;font-size:22px;font-weight:700;animation:pop .6s both,bn 2.4s ease-in-out infinite;animation-delay:calc(1.4s + var(--d)*.2s),calc(2.4s + var(--d)*.25s)}
/* M. interactive quiz slide */
.qz{background:#ffffff18;border:2px solid #ffffff30;border-radius:26px;padding:22px 30px;display:flex;flex-direction:column;gap:14px;animation:up .8s .4s both,glw 3s 1.4s ease-in-out infinite}
.qh{display:flex;justify-content:space-between;font-size:22px;color:#ffca3a;font-weight:700}
#qs{animation:hb 2s ease-in-out infinite}
.qt{font-size:30px;font-weight:700;line-height:1.5;min-height:92px;animation:up .5s both}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qb{display:flex;align-items:center;gap:14px;text-align:left;font:700 23px 'Noto Sans Tamil',sans-serif;color:#f4f1ea;background:#ffffff22;border:2px solid #f4a261;border-radius:16px;padding:14px 18px;cursor:pointer;transition:background .25s,transform .25s;animation:pop .5s both;animation-delay:calc(var(--d)*.1s)}
.qb:hover{background:#f4a26155;transform:scale(1.03)}
.qb b{flex:none;width:40px;height:40px;border-radius:50%;background:#f4a261;color:#14213d;display:grid;place-items:center}
.qb.ok{background:#2a9d8f!important;border-color:#8ac926;animation:tada 1s both}
.qb.no{background:#e63946!important;border-color:#ff8fa3;animation:shk .5s both}
.qb.rs{grid-column:1/-1;justify-content:center}
.qf{font-size:26px;min-height:36px;text-align:center;font-weight:700}
@keyframes shk{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
/* K. mouse spotlight, sparkle trail and particle bursts */
#spot{position:absolute;left:-999px;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;background:radial-gradient(circle,#ffffff26,transparent 60%);pointer-events:none;z-index:3}
.tr{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:radial-gradient(#ffca3a,#e76f5100);pointer-events:none;z-index:6;animation:trf .7s forwards}
@keyframes trf{to{transform:scale(.1) translateY(24px);opacity:0}}
.pt{position:absolute;font-size:26px;pointer-events:none;z-index:6;animation:ptf .95s ease-out forwards}
@keyframes ptf{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(360deg);opacity:0}}

/* ===== ROUND 3: FLIP CARDS, OVERVIEW, LASER, TIMER ===== */
.fcs{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:20px;flex:1;min-height:0}
.fc{perspective:900px;cursor:pointer;animation:pop .6s both;animation-delay:calc(.5s + var(--d)*.12s)}
.fi{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.fc.on .fi{transform:rotateY(180deg)}
.ff,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;box-shadow:0 8px 24px #0006}
.ff{background:linear-gradient(135deg,#e76f51,#f4a261);color:#14213d}
.ff span{font-size:40px}.ff b{font-size:36px;font-family:monospace}
.fb{background:linear-gradient(135deg,#1f5f4a,#2a9d8f);transform:rotateY(180deg);font-size:25px;font-weight:700;line-height:1.5}
.fc:hover .fi{filter:brightness(1.12)}
#ov{position:absolute;inset:0;background:#0b1020ee;z-index:20;display:none;flex-direction:column;padding:34px 50px;gap:18px}
#ov.show{display:flex;animation:pop .35s both}
#ov h4{font-size:34px;color:#f4a261}
#og{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;flex:1;overflow:auto}
.ot{background:#ffffff18;border:2px solid #f4a26166;border-radius:14px;padding:12px 16px;font-size:19px;line-height:1.4;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:transform .2s,background .2s;color:#f4f1ea;text-align:left;font-family:inherit}
.ot:hover{transform:scale(1.05);background:#f4a26144}
.ot.cur{border-color:#ffca3a;background:#ffca3a33}
.ot i{font-style:normal;flex:none;background:#f4a261;color:#14213d;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:700;font-size:16px}
#ovf{font-size:17px;color:#ffffffaa}
#ls{position:absolute;width:22px;height:22px;margin:-11px;border-radius:50%;background:radial-gradient(#fff,#ff2d2d 55%,#ff2d2d00 72%);box-shadow:0 0 22px 8px #ff2d2daa;pointer-events:none;z-index:30;display:none}
#st.laser,#st.laser *{cursor:none!important}
#tm{font-size:18px;margin-right:6px}
#nav button.act{background:#ffca3a;box-shadow:0 0 14px #ffca3a}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#000a;border:2px solid #f4a261;border-radius:30px;padding:8px 22px;font-size:20px;z-index:40;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
</style></head><body>
<div id="st"><div id="bs"></div><div id="sls"></div>
<div class="wk"><span>💻</span></div><div class="fy">🛰️</div>
<div class="ss"></div><div class="ss" style="top:220px;animation-delay:4s"></div><div class="rk">🚀</div><div id="cur"></div>
<div id="nav"><button onclick="go(-1)">◀</button><span id="pg"></span><button onclick="go(1)">▶</button><button id="fs" onclick="fsT()" title="முழுத்திரை">⛶</button><button id="mt" onclick="muteT()" title="ஒலி / Sound (M)">🔊</button></div><div id="bar"></div></div>
<script>
const card=(c,t,a)=>`<div class="card ${c}"><h3>${t}</h3><ul>${a.map((x,i)=>`<li style="--d:${i}">${x}</li>`).join('')}</ul></div>`;
const MS='Microsoft Office Presentation இல்',LO='LibreOffice Impress இல்';
const pair=(a,b,t,ic,p,ex='')=>`<h2><span class="ic">${ic}</span> ${t}</h2>${p?`<p class="sub">${p}</p>`:''}<div class="row">${card('ms',MS,a)}${card('lo',LO,b)}</div>${ex}`;
const orb=a=>`<div class="o">${a.map((x,i)=>`<i style="--a:${i*360/a.length}deg"><b>${x}</b></i>`).join('')}</div>`;
const BY=`<div class="by"><span class="byl">By -</span>${['N.Sarwin','K.Rathusan','K.Kopi','N.Anushan','T.Abishanth','R.Jathupriyan'].map((x,i)=>`<span class="nm" style="--d:${i}">${x}</span>`).join('')}</div>`;

var unlocked=false,muted=false,AC;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}

function tone(f,t0,dur,type,vol,f2){if(!unlocked||muted)return;const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function noise(t0,dur,f1,f2,vol){if(!unlocked||muted)return;const a=ac();if(!a)return;const t=a.currentTime+t0,len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const bp=a.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(f1,t);bp.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp);bp.connect(g);g.connect(a.destination);s.start(t)}

function qEnd(){qe('qn').textContent='முடிவு';qe('qt').textContent='உங்கள் புள்ளிகள்: '+sc+' / '+QS.length;qe('qo').innerHTML='<button class="qb rs" onclick="qReset()">🔄 மீண்டும் முயல்க</button>';qe('qf').textContent=sc==QS.length?'🏆 அருமை! முழுப் புள்ளிகள்!':sc>=3?'👏 நன்று! தொடர்ந்து முயலுங்கள்!':'📚 மீண்டும் முயன்று பாருங்கள்!';
if(sc>=3){sfxFan();for(let k=0;k<4;k++)setTimeout(()=>burst(200+Math.random()*880,200+Math.random()*300,18,['●'],1),k*300)}}
function qReset(){qi=0;sc=0;qe('qs').textContent='⭐ 0';qShow()}
qShow();

/* ===== ROUND 2 scripts ===== */
const bsEl=document.getElementById('bs'),sp=document.getElementById('spot');
for(let i=0;i<10;i++){const c=document.createElement('div');c.className='bin';c.style.cssText=`left:${i*130+Math.random()*60}px;animation-duration:${9+Math.random()*8}s;animation-delay:-${Math.random()*9}s`;c.textContent=Array.from({length:30},()=>Math.random()<.5?0:1).join('\n');bsEl.appendChild(c)}
function burst(x,y,k,g,col){for(let i=0;i<k;i++){const p=document.createElement('span'),a=Math.random()*6.283,d=80+Math.random()*180;p.className='pt';p.textContent=g[i%g.length];p.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;`+(col?`color:hsl(${Math.random()*360},90%,60%);`:'');st.appendChild(p);setTimeout(()=>p.remove(),1000)}}
let lt=0;
st.addEventListener('mousemove',e=>{const r=st.getBoundingClientRect(),s=r.width/1280,x=(e.clientX-r.left)/s,y=(e.clientY-r.top)/s;
sp.style.left=x+'px';sp.style.top=y+'px';
bsEl.style.transform=`translate(${(e.clientX/innerWidth-.5)*-40}px,${(e.clientY/innerHeight-.5)*-28}px)`;
if(Date.now()-lt>60){lt=Date.now();const t=document.createElement('i');t.className='tr';t.style.left=x+'px';t.style.top=y+'px';st.appendChild(t);setTimeout(()=>t.remove(),700)}});
st.addEventListener('click',e=>{const r=st.getBoundingClientRect(),s=r.width/1280;burst((e.clientX-r.left)/s,(e.clientY-r.top)/s,10,['💥','✨','⭐'],0)});

/* ===== ROUND 3 scripts ===== */
st.insertAdjacentHTML('beforeend','<div id="ov"><h4>📑 படவில்லைகள் — தெரிந்து செல்க</h4><div id="og"></div><div id="ovf">விசைகள்: ← → மாற்ற · G பட்டியல் · L லேசர் · P தானியங்கி · F முழுத்திரை · M ஒலி · Esc மூடு</div></div><div id="ls"></div><div id="toast"></div>');
const nav=document.getElementById('nav');
nav.insertAdjacentHTML('afterbegin','<span id="tm">⏱ 00:00</span>');
document.getElementById('fs').insertAdjacentHTML('beforebegin','<button id="gb" onclick="ovT()" title="பட்டியல் (G)">▦</button><button id="lb" onclick="lsT()" title="லேசர் (L)">🔴</button><button id="pb" onclick="apT()" title="தானியங்கி (P)">▶▶</button>');
let t0=Date.now();setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);document.getElementById('tm').textContent='⏱ '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1400)}
/* flip cards */
st.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.fc');if(c){c.classList.toggle('on');tone(c.classList.contains('on')?700:500,0,.15,'triangle',.12,c.classList.contains('on')?1100:300)}});
/* slide overview */
function ovT(){const o=document.getElementById('ov');if(o.classList.toggle('show')){document.getElementById('og').innerHTML=[...sls.children].map((s,i)=>{const h=s.querySelector('h1,h2');return `<button class="ot${i==n?' cur':''}" onclick="jump(${i})"><i>${i+1}</i>${h?h.textContent.replace(/\s+/g,' ').trim():'Slide'}</button>`}).join('');document.getElementById('gb').classList.add('act')}else document.getElementById('gb').classList.remove('act')}
function jump(i){document.getElementById('ov').classList.remove('show');document.getElementById('gb').classList.remove('act');go(i-n)}
/* laser pointer */
let lsOn=false;const ls=document.getElementById('ls');
function lsT(){lsOn=!lsOn;st.classList.toggle('laser',lsOn);ls.style.display=lsOn?'block':'none';document.getElementById('lb').classList.toggle('act',lsOn);toast(lsOn?'🔴 லேசர் இயக்கப்பட்டது':'லேசர் நிறுத்தப்பட்டது')}
st.addEventListener('mousemove',e=>{if(!lsOn)return;const r=st.getBoundingClientRect(),s=r.width/1280;ls.style.left=(e.clientX-r.left)/s+'px';ls.style.top=(e.clientY-r.top)/s+'px'});
/* auto-play */
let ap=null;
function apT(){if(ap){clearInterval(ap);ap=null;document.getElementById('pb').classList.remove('act');toast('தானியங்கி நிறுத்தப்பட்டது');return}
document.getElementById('pb').classList.add('act');toast('▶▶ தானியங்கி இயக்கம் (10 வினாடி)');ap=setInterval(()=>{if(n>=S.length-1){apT();return}go(1)},10000)}
/* keys + touch swipe */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k=='g')ovT();if(k=='l')lsT();if(k=='p')apT();if(e.key=='Escape')document.getElementById('ov').classList.remove('show')});
let tx=null;st.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
st.addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)go(d<0?1:-1);tx=null});
</script></body></html>
